version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: booksy-postgres
    environment:
      POSTGRES_DB: booksy
      POSTGRES_USER: booksy_user
      POSTGRES_PASSWORD: booksy_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booksy_user -d booksy"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: booksy-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://booksy_user:booksy_password@postgres:5432/booksy
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
